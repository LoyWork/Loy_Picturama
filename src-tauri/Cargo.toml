[package]
name = "picturama"
version = "2.0.1"
edition = "2021"

[workspace]
members = [".", "raw-decoder"]
default-members = ["."]
resolver = "3"

[[bin]]
name = "Picturama"
path = "src/main.rs"

[build-dependencies]
# Tauri's build script: generates the context (embeds tauri.conf.json, icons, capabilities) and runs
# the codegen that `tauri::generate_context!()` in main.rs depends on.
tauri-build = { version = "2", features = [] }

[dependencies]
# Date/time handling.
chrono             = "0.4"
# Resolves platform standard directories (home dir) to locate `~/.picturama` in release builds.
dirs               = "5"
# Unpacks the gzipped third-party license notice. No new code in the binary: Tauri already pulls flate2 in,
# this only names it so `commands/lifecycle.rs` may use it too.
flate2             = "1"
# Pure-Rust JPEG segment read/write. Used only by the photo export `withMetadata` option to copy the
# master JPEG's EXIF into the export.
img-parts          = "0.4"
# Cheap image-dimension probe: reads only the file header to get width/height without decoding pixels.
# Feeds the import dimension chain (JPEG/HEIC/RAW-preview sizing) in import_scanner.rs.
imagesize          = "0.13"
# Vendored standalone LightCraft RAW decoder and colour science (MIT OR Apache-2.0).
picturama-raw     = { path = "raw-decoder" }
# Insertion-order-preserving map. Used directly so the per-segment EXIF dump keeps natural EXIF field
# order for the info panel's "first 10 keys" fallback.
indexmap           = { version = "2", features = ["serde"] }
# EXIF reader/writer (the `exif` crate).
kamadak-exif       = "0.6"
# Native HEIC/HEIF decode via libheif. Windows builds use vcpkg's x64-windows-static triplet so libheif and
# its codecs are part of Picturama.exe.
# libheif-rs 0.20 is the newest release that still binds libheif-sys ^1.14 (libheif ~1.14/1.15) while
# exposing the modern `LibHeif` API. libheif-sys is pinned to 1.14.4 so it links against the system
# libheif 1.15.x rather than resolving up to the 1.16-targeted bindings. Bump both once target
# platforms are confirmed on a newer libheif.
libheif-rs         = "0.20"
libheif-sys        = "=1.14.4"
# Logging facade; the actual sink is tauri-plugin-log.
log                = "0.4"
# Lazily-initialised statics (e.g. process-wide caches/singletons in the store layer).
once_cell          = "1"
# Opens paths/URLs with the OS default handler.
open               = "5"
# Pure-Rust XML parser.
roxmltree          = "0.20"
# SQLite access. `bundled` compiles SQLite from source, so no system SQLite is required.
rusqlite           = { version = "0.31", features = ["bundled"] }
# Serialization framework for IPC-boundary structs.
serde              = { version = "1.0", features = ["derive"] }
# JSON (de)serialization for IPC payloads and settings.json.
serde_json         = "1"
# YAML (de)serialization for the picturama.yml PhotoWork sidecar files.
serde_yaml         = "0.9"
# Streaming SHA-256 for exact duplicate-photo detection.
sha2               = "0.10"
# Detects the OS UI locale to pick the app language.
sys-locale         = "0.3"
# The Tauri runtime: Native UI, IPC with frontend. Ships with the OS-level frosted glass
# (`Window::set_effects`, Windows Acrylic/Mica) used by `window_service.rs`.
tauri              = { version = "2", features = ["protocol-asset", "devtools"] }
# Native file/folder pickers.
tauri-plugin-dialog = "2"
# Routes the `log` facade to Tauri's logging sink.
tauri-plugin-log   = "2"
# Shell integration (opening items / spawning).
tauri-plugin-shell = "2"
# Async runtime. `full` enables all features; needed for the async foreground-RPC oneshot channels and
# the async command handlers (foreground_client.rs).
tokio              = { version = "1", features = ["full"] }
# Moves files to the OS trash/recycle bin instead of hard-deleting.
trash              = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[profile.dev.package.lightcraft-raw]
opt-level = 2

[profile.dev.package.lightcraft-raster]
opt-level = 2

[profile.dev.package.lightcraft-color]
opt-level = 2

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
lightcraft-raw = { path = "vendor/lightcraft/crates/raw" }
lightcraft-tiff = { path = "vendor/lightcraft/crates/tiff" }
lightcraft-meta = { path = "vendor/lightcraft/crates/meta" }
lightcraft-color = { path = "vendor/lightcraft/crates/color" }
lightcraft-geom = { path = "vendor/lightcraft/crates/geom" }
lightcraft-raster = { path = "vendor/lightcraft/crates/raster" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
rayon = "1"
miniz_oxide = "0.8"
quick-xml = "0.38"
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jxl-oxide = { version = "0.12", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
proptest = "1"
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"
